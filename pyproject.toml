[project]
name = "finfacts"
version = "0.6.0"
description = "Certified, point-in-time-correct SEC EDGAR fundamentals for humans and LLM agents."
readme = "README.md"
license = "MIT"
authors = [{ name = "Malav Naik" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "pyarrow>=26.0.0",
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "dbt-bigquery>=1.12.1",
    "google-cloud-bigquery>=3.46.2",
    "google-cloud-storage>=3.1.1",
    "dbt-metricflow>=0.15.0",
    "pyyaml>=6.0.3",
    "edgartools>=5.62.1",
    "sentence-transformers>=6.2.0",
    "lancedb>=0.40.0",
    "huggingface-hub>=2.3.0",
]

[project.scripts]
finfacts = "finfacts.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finfacts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
# The eval package generates SQL text on purpose (gold SQL is the published artifact); every
# interpolated value is a constant from the code, never user input.
"src/finfacts/eval/*" = ["S608"]
# Compares fixed tables from its TABLES constant; no input reaches the SQL.
"scripts/check_incremental_equivalence.py" = ["S608"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as call defaults; they are evaluated once and never mutated.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "google.cloud.storage"]  # ship no type stubs
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
