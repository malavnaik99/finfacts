- question: How many S&P 500 companies have had their fiscal 2022 revenue restated at least once?
  category: restatements
  answer_type: integer
  gold_sql: |
    select count(distinct cik) from semantic.financials_history
    where metric_id = 'revenue' and fiscal_year = 2022 and fiscal_period = 'FY' and is_restatement

- question: Among S&P 500 companies with fiscal 2024 revenue above 50 billion USD, which had the highest R&D expense as a share of revenue? Answer with its ticker.
  category: ranking
  answer_type: ticker
  gold_sql: |
    with x as (
      select cik,
             max(case when metric_id = 'research_and_development' then value end) as rnd,
             max(case when metric_id = 'revenue' then value end) as rev
      from semantic.financials where fiscal_year = 2024 and fiscal_period = 'FY'
      group by cik
    )
    select c.tickers from x join semantic.companies as c using (cik)
    where rev > 50e9 and rnd is not null order by rnd / rev desc limit 1

- question: Among S&P 500 companies with fiscal 2024 revenue above 10 billion USD, which had the lowest net margin? Answer with its ticker.
  category: ranking
  answer_type: ticker
  gold_sql: |
    with x as (
      select cik,
             max(case when metric_id = 'net_income' then value end) as ni,
             max(case when metric_id = 'revenue' then value end) as rev
      from semantic.financials where fiscal_year = 2024 and fiscal_period = 'FY'
      group by cik
    )
    select c.tickers from x join semantic.companies as c using (cik)
    where rev > 10e9 and ni is not null order by ni / rev limit 1

