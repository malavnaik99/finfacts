# Hand-written hard questions for FinFacts eval v1. Gold SQL runs on the `semantic` schema
# of the frozen snapshot (DuckDB). Answer types: number (0.5% tolerance), integer (exact),
# ticker (any of the company's tickers), ticker_set (same companies, any order), text.

- question: Which five S&P 500 companies had the highest free cash flow in fiscal year 2024? List their tickers.
  category: top_n
  answer_type: ticker_set
  gold_sql: |
    select c.tickers from semantic.financials as f join semantic.companies as c using (cik)
    where f.metric_id = 'free_cash_flow' and f.fiscal_year = 2024 and f.fiscal_period = 'FY'
    order by f.value desc limit 5

- question: How many S&P 500 companies reported a net loss in fiscal year 2023?
  category: count
  answer_type: integer
  gold_sql: |
    select count(*) from semantic.financials
    where metric_id = 'net_income' and fiscal_year = 2023 and fiscal_period = 'FY' and value < 0

- question: What was the median net margin, in percent, of Information Technology companies in fiscal year 2024?
  category: statistic
  answer_type: number
  gold_sql: |
    select median(f.value) * 100 from semantic.financials as f join semantic.companies as c using (cik)
    where c.gics_sector = 'Information Technology' and f.metric_id = 'net_margin'
      and f.fiscal_year = 2024 and f.fiscal_period = 'FY'

