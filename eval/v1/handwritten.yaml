- question: What was Oracle's (ORCL) ratio of total liabilities to total assets at the end of fiscal year 2024, in percent?
  category: ratio
  answer_type: number
  gold_sql: |
    select 100 * l.value / a.value from
      (select value from semantic.financials where cik = 1341439 and metric_id = 'total_liabilities'
         and fiscal_year = 2024 and fiscal_period = 'FY') as l,
      (select value from semantic.financials where cik = 1341439 and metric_id = 'total_assets'
         and fiscal_year = 2024 and fiscal_period = 'FY') as a

- question: What was Pfizer's (PFE) revenue growth from fiscal 2022 to fiscal 2023, in percent?
  category: growth
  answer_type: number
  gold_sql: |
    select (cur.value / prev.value - 1) * 100 from
      (select value from semantic.financials where cik = 78003 and metric_id = 'revenue'
         and fiscal_year = 2023 and fiscal_period = 'FY') as cur,
      (select value from semantic.financials where cik = 78003 and metric_id = 'revenue'
         and fiscal_year = 2022 and fiscal_period = 'FY') as prev

- question: What was the combined fiscal 2024 net income of the four largest US banks by total assets in the S&P 500 (USD)?
  category: aggregate
  answer_type: number
  gold_sql: |
    with banks as (
      select f.cik from semantic.financials as f join semantic.companies as c using (cik)
      where c.gics_sector = 'Financials' and c.gics_sub_industry like '%Diversified Banks%'
        and f.metric_id = 'total_assets' and f.fiscal_year = 2024 and f.fiscal_period = 'FY'
      order by f.value desc limit 4
    )
    select sum(value) from semantic.financials where cik in (select cik from banks)
      and metric_id = 'net_income' and fiscal_year = 2024 and fiscal_period = 'FY'

