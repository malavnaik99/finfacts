- question: By how much did Tesla's (TSLA) gross profit change from fiscal 2023 to fiscal 2024, in USD (negative if it fell)?
  category: growth
  answer_type: number
  gold_sql: |
    select cur.value - prev.value from
      (select value from semantic.financials where cik = 1318605 and metric_id = 'gross_profit'
         and fiscal_year = 2024 and fiscal_period = 'FY') as cur,
      (select value from semantic.financials where cik = 1318605 and metric_id = 'gross_profit'
         and fiscal_year = 2023 and fiscal_period = 'FY') as prev

