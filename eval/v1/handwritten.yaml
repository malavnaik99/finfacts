- question: What was Costco's (COST) compound annual revenue growth rate from fiscal 2019 to fiscal 2024, in percent?
  category: growth
  answer_type: number
  gold_sql: |
    select (power(cur.value / base.value, 1.0 / 5) - 1) * 100 from
      (select value from semantic.financials where cik = 909832 and metric_id = 'revenue'
         and fiscal_year = 2024 and fiscal_period = 'FY') as cur,
      (select value from semantic.financials where cik = 909832 and metric_id = 'revenue'
         and fiscal_year = 2019 and fiscal_period = 'FY') as base

