version: 2

# Semantic layer: the certified metrics defined once, for humans, the text-to-SQL agent and the
# MCP server. Values come from gold.fct_financials_latest (current certified versions).
# Time axis: annual metrics use fiscal_year_date (1 January of the fiscal year), so
# metric_time__year IS the fiscal year; quarterly metrics use the quarter's period end.
# Simple metrics sum the value; per company and period there is exactly one row, so the sum is
# the value itself. Summed across companies they give totals (meaningful for USD amounts, not
# for EPS or share counts).

models:
  - name: metricflow_time_spine
    description: Daily calendar used by MetricFlow for metric_time.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
  - name: sem_company
    description: Current version of each company (one row per CIK) for the semantic layer.

semantic_models:
  - name: financials
    description: Current certified values, one row per company x metric x fiscal period.
    model: ref('fct_financials_latest')
    defaults:
      agg_time_dimension: period_end
    entities:
      - name: financial_fact
        type: primary
        expr: financial_fact_id
      - name: company
        type: foreign
        expr: cik
    dimensions:
      - name: period_end
        type: time
        type_params:
          time_granularity: day
      - name: fiscal_year_date
        type: time
        type_params:
          time_granularity: day
      - name: metric_id
        type: categorical
      - name: fiscal_period
        type: categorical
      - name: fiscal_year
        type: categorical
      - name: is_derived
        type: categorical
    measures:
      - name: value
        description: Certified value (USD, USD/share, shares), on the period end date.
        agg: sum
      - name: value_fy
        description: Certified value on the fiscal-year axis (for annual metrics).
        agg: sum
        expr: value
        agg_time_dimension: fiscal_year_date

  - name: companies
    description: Companies in the universe (current names, tickers, GICS sector).
    model: ref('sem_company')
    entities:
      - name: company
        type: primary
        expr: cik
    dimensions:
      - name: name
        type: categorical
      - name: ticker
        type: categorical
        expr: tickers
      - name: gics_sector
        type: categorical
      - name: gics_sub_industry
        type: categorical

metrics:
  - name: revenue
    label: "Revenue (fiscal year)"
    description: "Total revenue. Banks: net interest income + non-interest income when no total revenue is tagged. Unit: USD."
    type: simple
    type_params:
      measure: value_fy
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'revenue'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('FY')
  - name: cost_of_revenue
    label: "Cost of revenue (fiscal year)"
    description: "Cost of goods and services sold, including depreciation where the company includes it. Unit: USD."
    type: simple
    type_params:
      measure: value_fy
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'cost_of_revenue'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('FY')
  - name: gross_profit
    label: "Gross profit (fiscal year)"
    description: "Reported gross profit; otherwise revenue minus cost of revenue. Unit: USD."
    type: simple
    type_params:
      measure: value_fy
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'gross_profit'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('FY')
  - name: operating_income
    label: "Operating income (fiscal year)"
    description: "Operating income (loss). Not reported by most banks and insurers. Unit: USD."
    type: simple
    type_params:
      measure: value_fy
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'operating_income'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('FY')
  - name: net_income
    label: "Net income (fiscal year)"
    description: "Net income (loss) attributable to the parent company's shareholders. Unit: USD."
    type: simple
    type_params:
      measure: value_fy
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'net_income'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('FY')
  - name: eps_diluted
    label: "Diluted EPS (fiscal year)"
    description: "Diluted earnings per share. Never derived: quarterly EPS cannot be subtracted. Unit: USD/shares."
    type: simple
    type_params:
      measure: value_fy
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'eps_diluted'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('FY')
  - name: shares_diluted
    label: "Diluted shares (fiscal year)"
    description: "Weighted average diluted shares outstanding. Never derived. Unit: shares."
    type: simple
    type_params:
      measure: value_fy
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'shares_diluted'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('FY')
  - name: research_and_development
    label: "R&D expense (fiscal year)"
    description: "Research and development expense. Unit: USD."
    type: simple
    type_params:
      measure: value_fy
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'research_and_development'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('FY')
  - name: sga
    label: "SG&A expense (fiscal year)"
    description: "Selling, general and administrative expense. Unit: USD."
    type: simple
    type_params:
      measure: value_fy
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'sga'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('FY')
  - name: total_assets
    label: "Total assets (fiscal year)"
    description: "Total assets at period end. Unit: USD."
    type: simple
    type_params:
      measure: value_fy
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'total_assets'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('FY')
  - name: total_liabilities
    label: "Total liabilities (fiscal year)"
    description: "Reported total liabilities; otherwise liabilities-and-equity minus total equity (incl. NCI) minus temporary equity. Unit: USD."
    type: simple
    type_params:
      measure: value_fy
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'total_liabilities'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('FY')
  - name: total_equity
    label: "Shareholders' equity (fiscal year)"
    description: "Equity attributable to the parent company (excludes non-controlling interests). Unit: USD."
    type: simple
    type_params:
      measure: value_fy
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'total_equity'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('FY')
  - name: cash_and_equivalents
    label: "Cash and equivalents (fiscal year)"
    description: "Cash and cash equivalents; excludes restricted cash where the company separates it. Unit: USD."
    type: simple
    type_params:
      measure: value_fy
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'cash_and_equivalents'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('FY')
  - name: long_term_debt
    label: "Long-term debt (fiscal year)"
    description: "Long-term debt including current maturities. Excludes short-term borrowings and commercial paper. Unit: USD."
    type: simple
    type_params:
      measure: value_fy
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'long_term_debt'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('FY')
  - name: operating_cash_flow
    label: "Operating cash flow (fiscal year)"
    description: "Net cash provided by (used in) operating activities. Unit: USD."
    type: simple
    type_params:
      measure: value_fy
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'operating_cash_flow'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('FY')
  - name: capex
    label: "Capital expenditure (fiscal year)"
    description: "Payments to acquire property, plant and equipment (a positive number). Unit: USD."
    type: simple
    type_params:
      measure: value_fy
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'capex'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('FY')
  - name: dividends_paid
    label: "Dividends paid (fiscal year)"
    description: "Cash dividends paid (a positive number). Unit: USD."
    type: simple
    type_params:
      measure: value_fy
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'dividends_paid'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('FY')
  - name: revenue_quarterly
    label: "Revenue (fiscal quarter)"
    description: "Revenue per fiscal quarter (Q1-Q4; Q4 usually derived as FY - 9M). Unit: USD."
    type: simple
    type_params:
      measure: value
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'revenue'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('Q1', 'Q2', 'Q3', 'Q4')
  - name: net_income_quarterly
    label: "Net income (fiscal quarter)"
    description: "Net income per fiscal quarter (Q1-Q4; Q4 usually derived as FY - 9M). Unit: USD."
    type: simple
    type_params:
      measure: value
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'net_income'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('Q1', 'Q2', 'Q3', 'Q4')
  - name: operating_cash_flow_quarterly
    label: "Operating cash flow (fiscal quarter)"
    description: "Operating cash flow per fiscal quarter (Q1-Q4; Q4 usually derived as FY - 9M). Unit: USD."
    type: simple
    type_params:
      measure: value
    filter: |
      {{ Dimension('financial_fact__metric_id') }} = 'operating_cash_flow'
      and {{ Dimension('financial_fact__fiscal_period') }} in ('Q1', 'Q2', 'Q3', 'Q4')
  - name: free_cash_flow
    label: "Free cash flow (fiscal year)"
    description: "Operating cash flow minus capital expenditure. Unit: USD."
    type: derived
    type_params:
      expr: operating_cash_flow - capex
      metrics:
        - name: operating_cash_flow
        - name: capex
  - name: gross_margin
    label: "Gross margin (fiscal year)"
    description: "Gross profit / revenue as a ratio of sums, so a group's margin is weighted by revenue (not an average of company margins)."
    type: ratio
    type_params:
      numerator: gross_profit
      denominator: revenue
  - name: operating_margin
    label: "Operating margin (fiscal year)"
    description: "Operating income / revenue as a ratio of sums, so a group's margin is weighted by revenue (not an average of company margins)."
    type: ratio
    type_params:
      numerator: operating_income
      denominator: revenue
  - name: net_margin
    label: "Net margin (fiscal year)"
    description: "Net income / revenue as a ratio of sums, so a group's margin is weighted by revenue (not an average of company margins)."
    type: ratio
    type_params:
      numerator: net_income
      denominator: revenue
